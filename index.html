<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cobalto</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#050d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cobalto">
<style>
:root{--ink:#050d24;--bl:#2f7bff;--dim:rgba(207,226,255,.62);--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--red:#ff5d73;--grn:#3ddc97;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:#fff;font:500 16px/1.3 ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
small{color:var(--dim);font-size:13px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#071638,#050d24)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);animation:f 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:70vw;height:70vw;left:-20vw;top:-15vw;background:#1d5be6aa}
.bg i:nth-child(2){width:60vw;height:60vw;right:-25vw;top:45vh;background:#0b8cff55;animation-delay:-8s}
@keyframes f{to{transform:translate3d(8vw,6vh,0) scale(1.15)}}
.glass{background:var(--g);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gb);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 30px rgba(0,10,40,.35)}
main{padding:0 16px calc(170px + var(--sb))}
#v{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:center;gap:12px;padding:18px 2px 14px}
.top h1{flex:1;font-size:32px;font-weight:800;letter-spacing:-.02em}
.mk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;background:linear-gradient(145deg,#5aa0ff,#1d4fd8);box-shadow:inset 0 1px 0 #fff6,0 6px 16px #1d4fd855}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--gb);background:var(--g);display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.rb:active,.chip:active,.pri:active,.fab:active{transform:scale(.94)}
.hero{padding:22px;margin-bottom:14px;background:linear-gradient(135deg,rgba(47,123,255,.5),rgba(47,123,255,.08))}
.hero big,.ac big{display:block;font-size:38px;font-weight:800;margin:4px 0;letter-spacing:-.02em}
h3{font-size:18px;margin:20px 4px 10px}
.empty{padding:28px 20px;text-align:center;color:var(--dim)}
.gc{padding:16px;margin-bottom:12px;cursor:pointer}
.gh{display:flex;align-items:center;gap:12px}
.gh>div{flex:1;min-width:0}
.gh b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ga{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(47,123,255,.22);color:#8fbaff}
.gh small{display:flex;align-items:center;gap:5px}
.pb{height:10px;border-radius:9px;background:rgba(255,255,255,.1);margin:14px 0 8px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2f7bff,#8fd0ff);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.gf{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.mh{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;padding:11px 16px;border-radius:18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 4px);background:rgba(10,30,80,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-bottom:2px solid rgba(143,186,255,.5)}
.mh b{font-size:16px}.mh span{font-size:13px;font-weight:700}
.rows{padding:2px 6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.row:last-child{border:0}
.ri{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ri.r{background:rgba(255,93,115,.16);color:var(--red)}.ri.v{background:rgba(61,220,151,.16);color:var(--grn)}.ri.b{background:rgba(47,123,255,.2);color:#8fbaff}
.rt{flex:1;min-width:0}.rt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.rd{color:var(--red)}.gn{color:var(--grn)}
.ck{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:none;display:grid;place-items:center;transition:.2s}
.ck svg{opacity:0;transition:.2s}
.ck.on{background:var(--grn);border-color:var(--grn);color:#052a1a}.ck.on svg{opacity:1}
.none{padding:14px 16px;color:var(--dim);font-size:14px}
.tabs{position:fixed;left:16px;right:16px;bottom:calc(12px + var(--sb));z-index:10;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:32px;background:rgba(14,32,86,.55)}
.tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:26px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 #fff4;transform:translateX(calc(var(--i,1)*100%));transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.tabs button{position:relative;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);transition:color .2s}
.tabs button.on{color:#fff}
.fab{position:fixed;right:22px;bottom:calc(92px + var(--sb));z-index:9;width:60px;height:60px;border-radius:50%;border:1px solid #fff4;display:grid;place-items:center;background:linear-gradient(145deg,#5aa0ff,#1d4fd8);box-shadow:inset 0 1px 0 #fff6,0 10px 26px #1d4fd888;transition:transform .2s}
.fab svg{transition:transform .25s}.fab.o svg{transform:rotate(135deg)}
.fm{position:fixed;right:22px;bottom:calc(164px + var(--sb));z-index:9;display:none;flex-direction:column;gap:10px;align-items:flex-end}
.fm.o{display:flex}
.fm button{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:22px;background:rgba(14,32,86,.7);border:1px solid var(--gb);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:pop .25s cubic-bezier(.3,1.4,.5,1) both}
.fm button:nth-child(2){animation-delay:.04s}.fm button:nth-child(1){animation-delay:.08s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}}
.sh{position:fixed;inset:0;z-index:20;display:none}.sh.open{display:block}
.bk{position:absolute;inset:0;background:rgba(2,8,28,.6);animation:fi .25s}
@keyframes fi{from{opacity:0}}
.pn{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sb));max-height:90dvh;overflow:auto;padding:22px 18px 18px;border-radius:32px;background:rgba(16,34,92,.78);animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.pn h2{font-size:22px;margin-bottom:6px}
.pn label,.pn .lb{display:block;font-size:13px;color:var(--dim);margin:16px 4px 8px}
.in{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:16px;outline:none;color-scheme:dark;min-height:50px}
.in:focus{border-color:var(--bl)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid var(--gb);background:rgba(255,255,255,.06);font-size:14px;transition:.15s}
.chip s{width:11px;height:11px;border-radius:50%;background:var(--c)}.chip svg{color:var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c)}
.sr{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 4px}
.sw{position:relative;width:52px;height:32px;margin:0!important}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--grn)}.sw input:checked+i::after{transform:translateX(20px)}
.pri{width:100%;margin-top:22px;padding:16px;border-radius:20px;border:1px solid #fff4;font-weight:700;background:linear-gradient(145deg,#5aa0ff,#1d4fd8);box-shadow:inset 0 1px 0 #fff6,0 8px 22px #1d4fd866;transition:transform .15s}
.del{width:100%;margin-top:6px;padding:14px;background:none;border:0;color:var(--red);font-weight:600}
.col{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col .chip{width:38px;height:38px;padding:0;justify-content:center;background:var(--c)}
.col .chip.on{outline:3px solid #fff;outline-offset:2px;background:var(--c)}
.col input[type=color]{width:38px;height:38px;border:0;border-radius:50%;background:none;padding:0}
.dn{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:6px}
.lgd{flex:1;display:flex;flex-direction:column;gap:9px;font-size:14px;min-width:0}
.lgd div{display:flex;align-items:center;gap:8px}.lgd s{width:10px;height:10px;border-radius:50%;flex:none}
.lgd b{margin-left:auto}
.ac{display:flex;justify-content:space-between;align-items:flex-end;padding:18px;margin-bottom:12px;border-radius:26px;border:1px solid var(--gb);cursor:pointer;box-shadow:inset 0 1px 0 #fff3;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 75%,#000),color-mix(in srgb,var(--c) 22%,transparent))}
.ac small{color:#ffffffb0}.ac b{font-size:18px}.ac big{margin:0;font-size:24px}
.cd{margin:14px 4px 4px}.cd b{display:block;font-size:28px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-90px);z-index:40;padding:12px 18px;border-radius:20px;background:rgba(14,32,86,.9);border:1px solid var(--gb);font-size:14px;transition:transform .3s}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="biz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.4-1-1.4-1.5-2.8-1.5-1.6 0-2.7.8-2.7 2 0 3 5.6 1.4 5.6 4.4 0 1.2-1.1 2-2.8 2-1.5 0-2.5-.6-3-1.6M12 6v1.7M12 16.3V18"/></symbol>
<symbol id="brain" viewBox="0 0 24 24"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4M12 5v13"/></symbol>
<symbol id="trend" viewBox="0 0 24 24"><path d="M22 7l-8.5 8.5-5-5L2 17M16 7h6v6"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 4 4 5-6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="goal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></symbol>
</defs></svg>
<main id="v"></main>
<div class="fm" id="fm"><button data-a="t">Transferir<svg width="20" height="20"><use href="#swap"/></svg></button><button data-a="i">Registrar ganancia<svg width="20" height="20" style="color:#3ddc97"><use href="#up"/></svg></button><button data-a="g">Registrar gasto<svg width="20" height="20" style="color:#ff5d73"><use href="#down"/></svg></button></div>
<button class="fab" id="fab" aria-label="Agregar"><svg width="28" height="28"><use href="#plus"/></svg></button>
<nav class="tabs glass"><i class="pill"></i>
<button data-t="0"><svg width="24" height="24"><use href="#goal"/></svg>Metas</button>
<button data-t="1"><svg width="24" height="24"><use href="#list"/></svg>Movimientos</button>
<button data-t="2"><svg width="24" height="24"><use href="#card"/></svg>Cuentas</button></nav>
<div class="sh" id="sh"><div class="bk"></div><div class="pn glass" id="pn"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='cobalto1',uid=()=>Math.random().toString(36).slice(2,9);
const CATS={yo:{n:'Yo',i:'user',c:'#ff5d73'},biz:{n:'Business',i:'biz',c:'#35d0ff'},mom:{n:'Ganancias momentáneas',i:'brain',c:'#a78bfa'}};
const COLS=['#ff5d73','#35d0ff','#a78bfa','#ffc83d','#3ddc97','#ff8a4c','#f472b6'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{acc:[{id:'a1',name:'Yo',color:'#ff5d73',bal:0},{id:'a2',name:'Business',color:'#35d0ff',bal:0},{id:'a3',name:'Ganancias momentáneas',color:'#a78bfa',bal:0}],tx:[],goals:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'-':'')+'S/ '+Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const ic=(n,s=22)=>`<svg width="${s}" height="${s}"><use href="#${n}"/></svg>`;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const dsh=d=>new Date(d+'T12:00').toLocaleDateString('es-PE',{day:'numeric',month:'short'});
const acc=id=>S.acc.find(a=>a.id==id)||{name:'Cuenta eliminada',color:'#7a8bb0',bal:0};
const addM=(k,d)=>{const[y,m]=k.split('-').map(Number),x=new Date(y,m-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const mname=k=>{const[y,m]=k.split('-').map(Number);return cap(new Date(y,m-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'}))};
const bal=(id,u='9999-99')=>{let b=+acc(id).bal||0;for(const t of S.tx){if((!t.paid&&t.type!='t')||t.date>u)continue;const m=+t.amt;if(t.type=='i'&&t.acc==id)b+=m;else if(t.type=='g'&&t.acc==id)b-=m;else if(t.type=='t'){if(t.from==id)b-=m;if(t.to==id)b+=m}}return b};
const total=()=>S.acc.reduce((s,a)=>s+bal(a.id),0),totalAt=d=>S.acc.reduce((s,a)=>s+bal(a.id,d),0);
let tab=1,ext=0,rng=3,F={},W='tx',obs;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
/* ---------- vistas ---------- */
function vGoals(){
 const tot=S.goals.reduce((s,g)=>s+Math.max(0,g.target-bal(g.acc)),0);
 return `<div class="top"><span class="mk">$</span><h1>Metas</h1><button class="rb" data-a="goal" aria-label="Nueva meta">${ic('plus')}</button></div>
 <div class="glass hero"><small>Te falta en total</small><big>${fmt(tot)}</big><small>${S.goals.length} ${S.goals.length==1?'meta activa':'metas activas'}</small></div>`+
 (S.goals.length?S.goals.map(g=>{const b=bal(g.acc),p=Math.max(0,Math.min(100,b/g.target*100)),c=CATS[g.cat]||CATS.yo;
 return `<div class="glass gc" data-g="${g.id}"><div class="gh"><span class="ga">${ic('trend',26)}</span><div><b>${esc(g.name)}</b><small><span style="color:${c.c};display:flex">${ic(c.i,14)}</span>${c.n} · ${esc(acc(g.acc).name)}</small></div><b>${fmt(g.target)}</b></div>
 <div class="pb"><i style="width:${p}%"></i></div><div class="gf"><span>${Math.round(p)}% cumplido</span><span>${fmt(Math.max(0,b))} de ${fmt(g.target)}</span></div></div>`}).join(''):`<div class="glass empty">Crea tu primera meta con el botón +</div>`);
}
function row(t){
 if(t.type=='t')return `<div class="row" data-id="${t.id}"><span class="ri b">${ic('swap')}</span><div class="rt"><b>${esc(acc(t.from).name)} → ${esc(acc(t.to).name)}</b><small>Transferencia · ${dsh(t.date)}</small></div><div class="ra">${fmt(t.amt)}</div></div>`;
 const g=t.type=='g',c=CATS[t.cat]||CATS.yo;
 return `<div class="row" data-id="${t.id}"><span class="ri ${g?'r':'v'}">${ic(c.i)}</span><div class="rt"><b>${esc(t.name||acc(t.acc).name)}</b><small>${c.n} · ${dsh(t.date)}</small></div><div class="ra"><span class="${g?'rd':'gn'}">${g?'-':'+'}${fmt(t.amt).replace('S/ ','S/ ')}</span><button class="ck ${t.paid?'on':''}" data-ck="${t.id}" aria-label="Pagado">${ic('check',16)}</button></div></div>`}
function mHTML(k){
 const L=S.tx.filter(t=>t.date.slice(0,7)==k).sort((a,b)=>b.date.localeCompare(a.date)),n=L.reduce((s,t)=>s+(t.type=='i'?+t.amt:t.type=='g'?-t.amt:0),0);
 return `<div class="mh" id="m-${k}"><b>${mname(k)}</b><span class="${n<0?'rd':n>0?'gn':''}">${n?(n>0?'+':'')+fmt(n):''}</span></div>`+(L.length?`<div class="glass rows">${L.map(row).join('')}</div>`:`<div class="none">Sin movimientos</div>`)}
function mkeys(){
 const n=today().slice(0,7),ks=S.tx.map(t=>t.date.slice(0,7)),hi=ks.concat(n).sort().pop(),lo=ks.concat(addM(n,-5-6*ext)).sort()[0],o=[];
 for(let k=hi;k>=lo&&o.length<240;k=addM(k,-1))o.push(k);return o}
function vMov(){
 return `<div class="top"><span class="mk">$</span><h1>Movimientos</h1><button class="rb" data-a="an" aria-label="Analytics">${ic('chart')}</button></div>
 <div class="glass hero" style="padding:16px 22px"><small>Balance total</small><big style="font-size:32px">${fmt(total())}</big></div><div id="list">${mkeys().map(mHTML).join('')}</div><div id="more" style="height:40px"></div>`}
function donut(it){
 const T=it.reduce((s,x)=>s+Math.max(0,x.v),0),R=42,C=2*Math.PI*R;let o=0;
 const p=T?it.filter(x=>x.v>0).map(x=>{const l=x.v/T*C,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="14" stroke-dasharray="${Math.max(l-2.5,.1)} ${C}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join(''):`<circle r="${R}" cx="60" cy="60" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14"/>`;
 return `<svg viewBox="0 0 120 120" width="140" height="140" style="transform:rotate(-90deg);flex:none">${p}</svg>`}
function legend(it){const T=it.reduce((s,x)=>s+Math.max(0,x.v),0);return `<div class="lgd">${it.map(x=>`<div><s style="background:${x.c}"></s><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)}</span><b>${T>0?Math.round(Math.max(0,x.v)/T*100):0}%</b></div>`).join('')}</div>`}
function vAcc(){
 const it=S.acc.map(a=>({v:bal(a.id),c:a.color,n:a.name}));
 return `<div class="top"><span class="mk">$</span><h1>Cuentas</h1><button class="rb" data-a="acc" aria-label="Añadir cuenta">${ic('plus')}</button></div>
 <div class="glass dn">${donut(it)}${legend(it)}</div>
 <h3>Mis cuentas</h3><div class="glass hero"><small>Total registrado</small><big>${fmt(total())}</big></div>
 ${S.acc.map(a=>`<div class="ac" data-c="${a.id}" style="--c:${a.color}"><div><small>Tarjeta</small><b>${esc(a.name)}</b></div><big>${fmt(bal(a.id))}</big></div>`).join('')||'<div class="glass empty">Añade tu primera cuenta con el botón +</div>'}`}
function render(jump){
 const y=scrollY;$('#v').innerHTML=[vGoals,vMov,vAcc][tab]();
 $('.tabs').style.setProperty('--i',tab);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#fab').style.display=tab==1?'':'none';closeFm();
 if(obs)obs.disconnect();
 if(tab==1){
  if(jump){const h=$('#m-'+today().slice(0,7));h&&h.scrollIntoView()}else scrollTo(0,y);
  obs=new IntersectionObserver(e=>{if(e[0].isIntersecting&&ext<40){ext++;mkeys().filter(k=>!$('#m-'+k)).forEach(k=>$('#more').insertAdjacentHTML('beforebegin',mHTML(k)))}},{rootMargin:'500px'});obs.observe($('#more'));
 }else if(jump)scrollTo(0,0);
}
/* ---------- hojas y formularios ---------- */
const open=h=>{$('#pn').innerHTML=h;$('#sh').classList.add('open')},close=()=>$('#sh').classList.remove('open');
const ch=(k,items,sel)=>`<div class="chips" data-k="${k}">${items.map(x=>`<button class="chip ${x.v==sel?'on':''}" data-v="${x.v}" style="--c:${x.c}">${x.i?ic(x.i,18):'<s></s>'}${esc(x.l)}</button>`).join('')}</div>`;
const catI=()=>Object.entries(CATS).map(([v,c])=>({v,l:c.n,i:c.i,c:c.c})),accI=()=>S.acc.map(a=>({v:a.id,l:a.name,c:a.color}));
const sw=(id,on)=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></label>`;
const val=id=>$('#'+id).value,num=id=>parseFloat(val(id).replace(',','.'));
function put(a,o){if(o.id)a[a.findIndex(x=>x.id==o.id)]=o;else{o.id=uid();a.push(o)}save();close();render()}
function txForm(type,id){
 if(!S.acc.length)return toast('Primero añade una cuenta');
 const t=id&&S.tx.find(x=>x.id==id);if(t)type=t.type;W='tx';
 F=t?{...t}:type=='t'?{type,from:S.acc[0].id,to:(S.acc[1]||S.acc[0]).id,amt:'',date:today(),paid:true}:{type,cat:'yo',acc:S.acc[0].id,amt:'',name:'',date:today(),paid:true};
 const amt=`<label>Monto (S/)</label><input class="in" id="fa" inputmode="decimal" placeholder="0.00" value="${F.amt}">`,dt=`<label>Fecha</label><input class="in" type="date" id="fd" value="${F.date}">`;
 open(type=='t'?`<h2>${t?'Editar':'Nueva'} transferencia</h2><label>Sale de</label>${ch('from',accI(),F.from)}${amt}<label>Llega a</label>${ch('to',accI(),F.to)}${dt}<button class="pri" data-s="tr">Guardar</button>${t?'<button class="del" data-s="del">Eliminar</button>':''}`
 :`<h2>${t?'Editar':'Registrar'} ${type=='g'?'gasto':'ganancia'}</h2><label>Categoría</label>${ch('cat',catI(),F.cat)}${amt}<label>Nombre (opcional)</label><input class="in" id="fn" value="${esc(F.name||'')}"><label>Cuenta</label>${ch('acc',accI(),F.acc)}${dt}<div class="sr"><span>${type=='g'?'Pagado':'Cobrado'}</span>${sw('fp',F.paid)}</div><button class="pri" data-s="tx">Guardar</button>${t?'<button class="del" data-s="del">Eliminar</button>':''}`)}
function goalForm(id){
 if(!S.acc.length)return toast('Primero añade una cuenta');
 const g=id&&S.goals.find(x=>x.id==id);W='goals';
 F=g?{...g}:{cat:'yo',acc:S.acc[0].id,name:'',target:'',start:today()};
 open(`<h2>${g?'Editar':'Nueva'} meta</h2><label>Nombre</label><input class="in" id="fn" value="${esc(F.name)}"><label>Categoría</label>${ch('cat',catI(),F.cat)}<label>Cuenta que la alimenta</label>${ch('acc',accI(),F.acc)}<label>Monto objetivo (S/)</label><input class="in" id="fa" inputmode="decimal" placeholder="0.00" value="${F.target}"><label>Fecha de inicio</label><input class="in" type="date" id="fd" value="${F.start}"><button class="pri" data-s="goal">Guardar meta</button>${g?'<button class="del" data-s="del">Eliminar</button>':''}`)}
function accForm(id){
 const a=id&&S.acc.find(x=>x.id==id);W='acc';
 F=a?{...a}:{name:'',bal:'',color:COLS[S.acc.length%COLS.length]};
 open(`<h2>${a?'Editar':'Añadir'} cuenta</h2><label>Nombre de la tarjeta</label><input class="in" id="fn" value="${esc(F.name)}"><label>${a?'Balance inicial':'Balance actual'} (S/)</label><input class="in" id="fa" inputmode="decimal" placeholder="0.00" value="${F.bal}"><div class="lb">Color</div><div class="col" data-k="color">${COLS.map(c=>`<button class="chip ${c==F.color?'on':''}" data-v="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}<input type="color" id="fc" value="${F.color}"></div><button class="pri" data-s="acc">Guardar cuenta</button>${a?'<button class="del" data-s="del">Eliminar</button>':''}`)}
function analytics(){
 W='';open(`<h2>Analytics</h2><div class="chips" id="rg" style="margin-top:10px">${[1,2,3,6,9,12].map(m=>`<button class="chip ${m==rng?'on':''}" data-r="${m}" style="--c:#2f7bff">${m} ${m>1?'meses':'mes'}</button>`).join('')}</div><div id="ch">${chart()}</div><h3>Por cuenta</h3><div class="dn" style="padding:0">${donut(S.acc.map(a=>({v:bal(a.id),c:a.color})))}${legend(S.acc.map(a=>({v:bal(a.id),c:a.color,n:a.name})))}</div>`)}
function chart(){
 const e=new Date(),s=new Date();s.setMonth(s.getMonth()-rng);const n=12,vs=[];
 for(let i=0;i<n;i++)vs.push(totalAt(iso(new Date(s.getTime()+(e-s)*i/(n-1)))));
 const mn=Math.min(...vs),sp=Math.max(...vs)-mn,X=i=>20+i*280/(n-1),Y=v=>20+(1-(sp?(v-mn)/sp:.5))*90,L=vs.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' '),d=vs[n-1]-vs[0];
 return `<div class="cd"><small>Variación en ${rng} ${rng>1?'meses':'mes'}</small><b class="${d>=0?'gn':'rd'}">${d>=0?'+':'-'}${fmt(Math.abs(d))}</b></div><svg viewBox="0 0 320 145" width="100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></linearGradient></defs><polygon points="20,125 ${L} 300,125" fill="url(#lg)" stroke="none"/><polyline points="${L}" stroke="#8fbaff" stroke-width="2.5"/><circle cx="${X(n-1)}" cy="${Y(vs[n-1])}" r="5" fill="#fff" stroke="none"/><g fill="#a9c4f0" stroke="none" font-size="10"><text x="20" y="140">${dsh(iso(s))}</text><text x="300" y="140" text-anchor="end">Hoy</text></g></svg>`}
const acts={
 tx(){const a=num('fa');if(!(a>0))return toast('Ingresa un monto mayor a 0');F.amt=a;F.name=val('fn').trim();F.date=val('fd')||today();F.paid=$('#fp').checked;put(S.tx,F)},
 tr(){const a=num('fa');if(!(a>0))return toast('Ingresa un monto mayor a 0');if(F.from==F.to)return toast('Elige dos cuentas distintas');F.amt=a;F.date=val('fd')||today();put(S.tx,F)},
 goal(){const a=num('fa'),n=val('fn').trim();if(!n)return toast('Ponle un nombre a la meta');if(!(a>0))return toast('Ingresa el monto objetivo');F.name=n;F.target=a;F.start=val('fd')||today();put(S.goals,F)},
 acc(){const n=val('fn').trim();if(!n)return toast('Ponle un nombre a la cuenta');F.name=n;F.bal=num('fa')||0;put(S.acc,F)},
 del(){if(!confirm(W=='acc'?'Se eliminarán también sus movimientos y metas. ¿Continuar?':'¿Eliminar?'))return;S[W]=S[W].filter(x=>x.id!=F.id);if(W=='acc'){S.tx=S.tx.filter(t=>t.acc!=F.id&&t.from!=F.id&&t.to!=F.id);S.goals=S.goals.filter(g=>g.acc!=F.id)}save();close();render()}
};
/* ---------- eventos ---------- */
const closeFm=()=>{$('#fm').classList.remove('o');$('#fab').classList.remove('o')};
$('#sh').addEventListener('click',e=>{
 if(e.target.classList.contains('bk'))return close();
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.s)return acts[b.dataset.s]();
 if(b.dataset.r){rng=+b.dataset.r;$('#rg').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));$('#ch').innerHTML=chart();return}
 const g=b.closest('[data-k]');if(g&&b.dataset.v){F[g.dataset.k]=b.dataset.v;g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
});
$('#sh').addEventListener('input',e=>{if(e.target.id=='fc'){F.color=e.target.value;$('.col').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'))}});
$('#fab').onclick=()=>{$('#fm').classList.toggle('o');$('#fab').classList.toggle('o')};
document.addEventListener('click',e=>{
 const t=e.target,x=s=>t.closest(s);
 if(!x('#fm')&&!x('#fab'))closeFm();
 if(x('.tabs button')&&x('.tabs button').dataset.t!=tab){tab=+x('.tabs button').dataset.t;return render(true)}
 const a=x('[data-a]');
 if(a){closeFm();const k=a.dataset.a;return k=='goal'?goalForm():k=='acc'?accForm():k=='an'?analytics():txForm(k)}
 const ck=x('[data-ck]');
 if(ck){const q=S.tx.find(r=>r.id==ck.dataset.ck);q.paid=!q.paid;save();return render()}
 const r=x('.row');if(r)return txForm(0,r.dataset.id);
 const g=x('[data-g]');if(g)return goalForm(g.dataset.g);
 const c=x('[data-c]');if(c)return accForm(c.dataset.c);
});
render(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
